<form
  class="login-form"
  novalidate
  (submit)="handleSubmit($event)"
>
  <app-text-field
    inputId="login-email"
    label="Email"
    prefixIcon="email"
    placeholder="Enter your email"
    type="email"
    inputMode="email"
    autocomplete="email"
    [formField]="loginForm.email"
  />

  <div class="login-form__password-group">
    <app-password-field
      inputId="login-password"
      label="Password"
      prefixIcon="lock"
      placeholderIcon="visibility-off"
      placeholder="Enter your password"
      autocomplete="current-password"
      [formField]="loginForm.password"
    />

    <a
      class="login-form__forgot-password"
      routerLink="/auth/forgot-password"
    >
      Forgot password?
    </a>
  </div>

  <div
    class="login-form__server-message"
    aria-live="polite"
  >
    <app-form-message
      [message]="serverError()"
      type="error"
    />
  </div>

  <app-button
    type="submit"
    [fullWidth]="true"
    [disabled]="
      loading() || loginForm().submitting()
    "
    [loading]="
      loading() || loginForm().submitting()
    "
  >
    Log In
  </app-button>
</form>
