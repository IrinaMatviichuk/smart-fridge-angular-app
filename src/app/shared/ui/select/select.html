<div
  class="select"
  [class.select--primary]="
    variant() === 'primary'
  "
  [class.select--secondary]="
    variant() === 'secondary'
  "
  [class.select--open]="open()"
  [class.select--disabled]="disabled()"
>
  <button
    class="select__trigger"
    type="button"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
    (click)="toggle()"
  >
    <span
      class="select__value"
      [class.select__value--placeholder]="
        !selectedOption()
      "
    >
      {{
        selectedOption()?.label ??
        placeholder()
      }}
    </span>

    <mat-icon
      class="select__chevron"
      [class.select__chevron--open]="open()"
      [svgIcon]="icons.chevronDown"
      aria-hidden="true"
    />
  </button>

  @if (open()) {
    <div
      class="select__panel"
      role="listbox"
      [attr.aria-label]="ariaLabel()"
    >
      @for (option of options();
        track option.value) {
        <button
          class="select__option"
          type="button"
          role="option"
          [class.select__option--selected]="
            option.value === value()
          "
          [disabled]="option.disabled"
          [attr.aria-selected]="
            option.value === value()
          "
          (click)="selectOption(option)"
        >
          <span class="select__option-label">
            {{ option.label }}
          </span>

          @if (option.value === value()) {
            <mat-icon
              class="select__check"
              [svgIcon]="icons.check"
              aria-hidden="true"
            />
          }
        </button>
      }
    </div>
  }
</div>
