<div class="dashboard-products">
  <div class="dashboard-products__grid">
    @for (item of model().products; track item.product.id) {
      <app-product-card
        [product]="item.card"
        [actions]="productActions"
        (actionSelected)="
          handleActionSelected(
            item.product,
            $event
          )
        "
      />
    }
  </div>
</div>
