<section class="dashboard-page">
  <app-dashboard-toolbar
    [model]="toolbarModel()"
    (storageChanged)="
      handleStorageChanged($event)
    "
    (addProductRequested)="
      handleAddProduct()
    "
  />

  <app-dashboard-summary
    [summary]="facade.summary()"
  />

  <app-dashboard-product-controls
    [model]="productControlsModel()"
    (statusChanged)="
      facade.selectStatus($event)
    "
    (categoryChanged)="
      facade.selectCategory($event)
    "
    (sortChanged)="
      facade.selectSort($event)
    "
  />

  <div class="dashboard-page__content">
    @if (facade.loading()) {
      <div
        class="dashboard-page__loading"
        role="status"
        aria-live="polite"
        aria-label="Loading products"
      >
        <app-loading-spinner />
      </div>
    } @else if (facade.error()) {
      <div
        class="dashboard-page__error"
        role="alert"
      >
        {{ facade.error() }}
      </div>
    } @else if (facade.isStorageEmpty()) {
      <app-empty-state
        [data]="storageEmptyState()"
        (actionRequested)="
          handleAddProduct()
        "
      />
    } @else if (facade.isFilterResultEmpty()) {
      <app-empty-state
        [data]="filterEmptyState()"
      />
    } @else {
      <app-dashboard-products
        [model]="productsModel()"
        (editRequested)="
          handleEditProduct($event)
        "
        (deleteRequested)="
          handleDeleteProduct($event)
        "
      />
    }
  </div>
</section>
