@if (!hidden()) {
  <app-form-field
    [inputId]="inputId()"
    [messageId]="messageId()"
    [label]="label()"
    [required]="required()"
    [invalid]="showInvalidState()"
    [errorMessage]="errorMessage()"
    [reserveMessageSpace]="reserveErrorSpace()"
  >
    <div
      class="password-field__control-wrapper"
      [class.password-field__control-wrapper--with-prefix]="
        prefixIcon()
      "
      [class.password-field__control-wrapper--invalid]="
        showInvalidState()
      "
      [class.password-field__control-wrapper--disabled]="
        disabled()
      "
    >
      @if (prefixIcon(); as icon) {
        <mat-icon
          class="password-field__prefix-icon"
          [svgIcon]="icon"
          aria-hidden="true"
        />
      }

      <input
        class="password-field__control"
        [id]="inputId()"
        [type]="
          passwordVisible() ? 'text' : 'password'
        "
        [autocomplete]="autocomplete()"
        [placeholder]="placeholder()"
        [value]="value()"
        [disabled]="disabled()"
        [readOnly]="readonly()"
        [required]="required()"
        [attr.minlength]="minLength()"
        [attr.aria-invalid]="
          showInvalidState() ? 'true' : 'false'
        "
        [attr.aria-describedby]="
          errorMessage() ? messageId() : null
        "
        (input)="handleInput($event)"
        (blur)="handleBlur()"
      />

      @if (!hasValue() && placeholderIcon(); as icon) {
        <mat-icon
          class="password-field__placeholder-icon"
          [svgIcon]="icon"
          aria-hidden="true"
        />
      }

      @if (hasValue()) {
        <button
          class="password-field__visibility-button"
          type="button"
          [disabled]="disabled() || readonly()"
          [attr.aria-label]="
            passwordVisible()
              ? 'Hide password'
              : 'Show password'
          "
          [attr.aria-pressed]="passwordVisible()"
          (click)="togglePasswordVisibility()"
        >
          <mat-icon
            class="password-field__visibility-icon"
            [svgIcon]="
              passwordVisible()
                ? visibilityOffIcon
                : visibilityIcon
            "
            aria-hidden="true"
          />
        </button>
      }
    </div>
  </app-form-field>
}
