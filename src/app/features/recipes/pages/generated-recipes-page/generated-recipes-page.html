<section class="generated-recipes-page">
  <app-recipe-flow-header
    title="Recipe Suggestions"
    subtitle="Here are recipe ideas based on the ingredients available in your inventory."
    backFallbackUrl="/recipes/suggestions"
  />

  <app-collapsible-recipe-grid aria-label="Generated recipes">
    @for (recipe of generationFacade.generatedRecipes(); track recipe.id) {
      <app-generated-recipe-card
        [recipe]="recipe"
        [favorite]="savedFacade.isSaved(recipe.id)"
        [favoritePending]="savedFacade.isMutating(recipe.id)"
        (selected)="handleRecipeSelected($event)"
        (favoriteChanged)="handleFavoriteChanged($event)"
      />
    }
  </app-collapsible-recipe-grid>

  <app-tip-frame [model]="tip" />

  @if (actionErrorTip(); as actionErrorTipModel) {
    <app-tip-frame
      class="generated-recipes-page__action-error"
      [model]="actionErrorTipModel"
      role="alert"
      aria-live="assertive"
    />
  }
</section>
