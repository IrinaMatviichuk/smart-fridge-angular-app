<section
  class="login-page"
  aria-labelledby="login-page-title"
>
  <header class="login-page__header">
    <h1
      id="login-page-title"
      class="login-page__title"
    >
      Welcome back!
    </h1>

    <p class="login-page-page__subtitle">
      Log in to your account to continue
    </p>
  </header>

  <app-login-form
    class="login-page__form"
    [loading]="loading()"
    [serverError]="error()"
    (submitted)="handleLogin($event)"
  />

  <p class="login-page__footer">
    <span>Don’t have an account?</span>

    <a
      class="login-page__link"
      routerLink="/auth/sign-up"
    >
      Sign Up
    </a>
  </p>
</section>
