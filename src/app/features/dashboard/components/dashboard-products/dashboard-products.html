<section
  class="dashboard-products"
  aria-label="Products"
  [attr.aria-busy]="model().loading"
>
  @if (model().loading) {
    <div
      class="dashboard-products__loading"
      role="status"
      aria-live="polite"
    >
      Loading products...
    </div>
  } @else {
    <div class="dashboard-products__grid">
      @for (product of model().products;
        track product.id) {
        <app-product-card
          [product]="product"
          (selected)="
            productSelected.emit($event)
          "
          (menuRequested)="
            productMenuRequested.emit($event)
          "
        />
      }
    </div>
  }
</section>
