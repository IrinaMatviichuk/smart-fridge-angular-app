<section
  class="dashboard-summary"
  aria-label="Product summary"
>
  @for (card of cards(); track card.key) {
    <app-summary-card
      [label]="card.label"
      [value]="card.value"
      [description]="card.description"
      [icon]="card.icon"
      [tone]="card.tone"
    />
  }
</section>
