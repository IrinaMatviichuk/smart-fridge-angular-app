<article
  class="product-card"
  tabindex="0"
  role="button"
  [attr.aria-label]="'Open ' + product().title"
  (click)="handleSelected()"
  (keydown)="handleCardKeydown($event)"
>
  <div class="product-card__header">
    <h3 class="product-card__title">
      {{ product().title }}
    </h3>

    @if (actions().length) {
      <app-action-menu
        class="product-card__menu"
        [actions]="actions()"
        triggerAriaLabel="Open product actions"
        (actionSelected)="
          handleActionSelected($event)
        "
      />
    }
  </div>

  @if (product().quantity) {
    <p class="product-card__quantity">
      {{ product().quantity }}
    </p>
  }

  <div class="product-card__expiry">
    <mat-icon
      class="product-card__expiry-icon"
      [svgIcon]="icons.calendar"
      aria-hidden="true"
    />

    <span>
      {{ product().expiryLabel }}
    </span>
  </div>

  <app-status-chip
    class="product-card__status"
    [tone]="product().statusTone"
  >
    {{ product().statusLabel }}
  </app-status-chip>
</article>
