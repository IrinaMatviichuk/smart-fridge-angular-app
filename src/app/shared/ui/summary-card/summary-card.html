<article
  class="summary-card"
  [class.summary-card--info]="tone() === 'info'"
  [class.summary-card--warning]="tone() === 'warning'"
  [class.summary-card--error]="tone() === 'error'"
  [class.summary-card--success]="tone() === 'success'"
>
  <div class="summary-card__content">
    <h2 class="summary-card__label">
      {{ label() }}
    </h2>

    <p class="summary-card__value">
      {{ value() }}
    </p>

    <p class="summary-card__description">
      {{ description() }}
    </p>
  </div>

  <mat-icon
    class="summary-card__icon"
    [svgIcon]="icon()"
    aria-hidden="true"
  />
</article>
