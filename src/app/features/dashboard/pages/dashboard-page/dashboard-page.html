<section class="dashboard-page">
  <app-dashboard-toolbar
    [model]="toolbarModel()"
    (storageChanged)="
      handleStorageChanged($event)
    "
    (addProductRequested)="
      handleAddProduct()
    "
  />

  <app-dashboard-summary
    [summary]="facade.summary()"
  />

  <app-dashboard-status-filter
    [model]="statusFilterModel()"
    (valueChanged)="
      facade.selectStatus($event)
    "
  />

  <div class="dashboard-page__content">
    @if (facade.loading()) {
      <div class="dashboard-page__loading">
        <app-loading-spinner
          size="md"
          label="Loading products"
        />
      </div>
    } @else if (facade.error()) {
      <div
        class="dashboard-page__error"
        role="alert"
      >
        {{ facade.error() }}
      </div>
    } @else if (facade.isStorageEmpty()) {
      <app-empty-state
        [data]="storageEmptyState()"
        (actionRequested)="
          handleAddProduct()
        "
      />
    } @else if (facade.isFilterResultEmpty()) {
      <app-empty-state
        [data]="filterEmptyState()"
      />
    } @else {
      <app-dashboard-products
        [model]="productsModel()"
      />
    }
  </div>
</section>
